<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">

  <!-- Academic Citation Meta Tags (Google Scholar & Open Graph) -->
  <meta name="citation_author" content="Denny Rakhmad Widi Ashari">
  <meta name="citation_author_institution" content="Universitas Nahdlatul Ulama Blitar">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Contoh Paling sederhana Honeypot -->
  <meta name="generator" content="WordPress 6.4.15" />
  <meta name="generator" content="Site Kit by Google 1.185.0" /><style type="text/css" id="custom-background-css">
  
  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Favicon placeholder via SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
  <!-- Header / Navigation -->
  {% include header.html %}

  <!-- Main Content Container -->
  <main class="main-wrapper">
    {{ content }}
  </main>

  <!-- Footer -->
  {% include footer.html %}

  <!-- BaseURL context for client-side scripts -->
  <script>
    window.SITE_BASEURL = "{{ site.baseurl | default: '' }}";
  </script>

  <!-- Client-side Interactive Search & Feature Script -->
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
